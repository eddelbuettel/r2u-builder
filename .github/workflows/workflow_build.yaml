## cf https://docs.github.com/en/actions/how-tos/reuse-automations/reuse-workflows

name: workflow_build

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true 

on:
  workflow_call:
    inputs:
      dist:
        description: 'The Ubuntu distribution to use'
        required: true
        default: 'noble'
        type: string
      arch:
        description: 'Architecture: "" or "-arm"'
        required: false
        default: ''
        type: string
      targets:
        description: 'JSON all: {"target":["a","b","c"]}'
        required: true
        default: ''
        type: string
      flags:
        description: 'Extra builder flags such "-s .2"'
        required: false
        default: ''
        type: string
        
        
jobs:
  build:
    runs-on: ubuntu-24.04${{ inputs.arch }}
    container:
      image: eddelbuettel/gha_r2u_build:${{ inputs.dist }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(inputs.targets) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Get Config
        uses: actions/download-artifact@v7
        with:
          name: r2u_config
          path: ~/.local/share/R/r2u
      - name: Fetch Updated Config
        uses: actions/checkout@v7
        with:
          repository: eddelbuettel/r2u-config
          path: r2u-config
      - name: Copy Updated depends.dcf
        run: cp -vax r2u-config/depends.dcf r2u-config/depends.${{ inputs.dist }}.dcf ~/.local/share/R/r2u
      # - name: Update Config
      #   id: config_update
      #   ## Use setter for the config file
      #   run: Rscript -e 'file <- r2u:::.defaultConfigFile(); cfg <- read.dcf(file); cfg <- r2u:::.updateConfig(cfg, "package_repo_preference", "cran"); r2u:::.writeConfigFile(cfg, file)'
      # - name: Update Config (Take 2)
      #   if: steps.config_update.outcome == failure()
      #   run: Rscript -e 'file <- r2u:::.defaultConfigFile(); cfg <- read.dcf(file); cfg <- r2u:::.updateConfig(cfg, "package_repo_preference", "cran"); r2u:::.writeConfigFile(cfg, file)'
      # - name: Update CRAN cache info
      #   id: cache_update
      #   run: Rscript -e 'r2u:::.loadAP(repo="cran", force=TRUE)'
      # - name: Update CRAN cache info (Take 2)
      #   if: steps.cache_update.outcome == failure()
      #   run: Rscript -e 'r2u:::.loadAP(repo="cran", force=TRUE)'
      - name: Show package name
        run: echo "Matrix arg is ${{ matrix.target }}"
      - name: Build
        run:  r2u.r ${{ inputs.flags }} -x -v -d -c -f -r ${{ inputs.dist }} package ${{ matrix.target }}
      - name: Check Once
        id: check
        continue-on-error: true
        run:  test -f /var/local/r2u/ubuntu/pool/dists/${{ inputs.dist}}/main/*.deb
      - name: Build (Take 2)
        # build fails about 3 or 4 per cent of the time so conditionally
        # rebuilding here -- but build can fail in different commands with
        # different error exits that are not consistently caught (only
        # 'exit 1 is, apparently) so triggering in 'check' instead of 'build'
        if: steps.check.outcome == 'failure'
        run:  |
          sleep 30
          r2u.r ${{ inputs.flags }} -x -v -d -c -f -r ${{ inputs.dist }} package ${{ matrix.target }}
      - name: Check Again
        run:  test -f /var/local/r2u/ubuntu/pool/dists/${{ inputs.dist}}/main/*.deb
      - name: Release
        if: success()
        id: release
        continue-on-error: true
        #uses: softprops/action-gh-release@v2.2.2  # 2025-06-10: v2 is currently broken
        #      2.4.2 works reliably but trigger 'node24' warnings
        uses: softprops/action-gh-release@v3
        with:
          files: /var/local/r2u/ubuntu/pool/dists/${{ inputs.dist }}/main/*deb
          make_latest: true
          prerelease: false
          tag_name: latest
          token: ${{ secrets.PAT_GITHUB }}
      - name: Release (Take 2)
        if: steps.release.outcome == 'failure'
        # we have about one in 10 or 20 uploads fail and a simple (conditional)
        # rerun helps; adding this second trial may alleviate a few of these
        #uses: softprops/action-gh-release@v2.2.2  # 2025-06-10: v2 is currently broken
        #      2.4.2 works reliably but trigger 'node24' warnings
        uses: softprops/action-gh-release@v3
        with:
          files: /var/local/r2u/ubuntu/pool/dists/${{ inputs.dist }}/main/*deb
          make_latest: true
          prerelease: false
          tag_name: latest
          token: ${{ secrets.PAT_GITHUB }}
      
