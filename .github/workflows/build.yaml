# Experiment with bioc build via actions

name: build

on:
  #push:
  #pull_request:
  ##release:
  workflow_dispatch:
    inputs:
      repo:
        description: 'Repo for Package Status'
        required: true
        default: 'cran'
        type: choice
        options:
          - p3m
          - cran
      flags:
        description: 'Extra builder flags such "-s .2"'
        required: false
        default: ''
        type: string
      jammy:
        description: 'jammy all: {"target":["a","b","c"]}'
        required: true
        default: '{"target":[""]}'
        type: string
      noble:
        description: 'noble all: {"target":["a","b","c"]}'
        required: true
        default: '{"target":[""]}'
        type: string
      noble_arm:
        description: 'noble arm: {"target":["a","c"]}'
        required: true
        default: '{"target":[""]}'
        type: string
      resolute:
        description: 'resolute all: {"target":["a","b","c"]}'
        required: true
        default: '{"target":[""]}'
        type: string
      resolute_arm:
        description: 'resolute arm: {"target":["a","c"]}'
        required: true
        default: '{"target":[""]}'
        type: string

jobs:
  setup:
    runs-on: ubuntu-latest
    container:
      image: eddelbuettel/gha_r2u_build:noble
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Create Default Config and Cache
        run: |
          r -e 'r2u:::.createDefaultConfiguration()'
      - name: Fetch Updated Config
        uses: actions/checkout@v7
        with:
          repository: eddelbuettel/r2u-config
          path: r2u-config
      - name: Copy Updated Config
        run: cp -vax r2u-config/* ~/.local/share/R/r2u
      - name: Create Cache
        run: |
          r -e 'r2u:::.loadDB()'
          r -e 'r2u:::.loadAP(repo="${{ inputs.repo }}")'
          r -e 'r2u:::.allBuilds("jammy")'
          r -e 'r2u:::.allBuilds("noble")'
          r -e 'r2u:::.allBuilds("resolute")'
      - name: Upload Config
        uses: actions/upload-artifact@v7
        with:
          name: r2u_config
          path: ~/.local/share/R/r2u
    
  build_jammy:
    needs: setup
    if: ${{ inputs.jammy != '{"target":[""]}' }}
    name: "jammy"
    uses: eddelbuettel/r2u-builder/.github/workflows/workflow_build.yaml@main
    with:
      dist: "jammy"
      targets: ${{ inputs.jammy }}
      flags: ${{ inputs.flags }}
    secrets: inherit
    
  build_noble:
    needs: setup
    if: ${{ inputs.noble != '{"target":[""]}' }}
    name: "noble"
    uses: eddelbuettel/r2u-builder/.github/workflows/workflow_build.yaml@main
    with:
      dist: "noble"
      targets: ${{ inputs.noble }}
      flags: ${{ inputs.flags }}
    secrets: inherit
    
  build_noble_arm:
    needs: setup
    if: ${{ inputs.noble_arm != '{"target":[""]}' }}
    name: "noble (arm64)"
    uses: eddelbuettel/r2u-builder/.github/workflows/workflow_build.yaml@main
    with:
      dist: "noble"
      arch: "-arm"
      targets: ${{ inputs.noble_arm }}
      flags: ${{ inputs.flags }}
    secrets: inherit

  build_resolute:
    needs: setup
    if: ${{ inputs.resolute != '{"target":[""]}' }}
    name: "resolute"
    uses: eddelbuettel/r2u-builder/.github/workflows/workflow_build.yaml@main
    with:
      dist: "resolute"
      targets: ${{ inputs.resolute }}
      flags: ${{ inputs.flags }}
    secrets: inherit
    
  build_resolute_arm:
    needs: setup
    if: ${{ inputs.resolute_arm != '{"target":[""]}' }}
    name: "resolute (arm64)"
    uses: eddelbuettel/r2u-builder/.github/workflows/workflow_build.yaml@main
    with:
      dist: "resolute"
      arch: "-arm"
      targets: ${{ inputs.resolute_arm }}
      flags: ${{ inputs.flags }}
    secrets: inherit
    
          
